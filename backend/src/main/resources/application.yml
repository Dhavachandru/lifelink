spring:
  application:
    name: lifelink-os-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:lifelinkdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}
  error:
    include-message: always
    include-binding-errors: always

# Security & JWT Configuration
jwt:
  secret: ${JWT_SECRET:lifelink_super_secure_jwt_secret_key_minimum_256_bits_length_for_hmac_sha256_algorithm_2026}
  access-token-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:900000} # 15 minutes
  refresh-token-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000} # 7 days

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}

# AI Provider Configuration (OpenAI Compatible + Deterministic Fallback)
ai:
  openai:
    api-key: ${OPENAI_API_KEY:}
    base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
    model: ${OPENAI_MODEL:gpt-4o-mini}
  fallback-enabled: ${AI_FALLBACK_ENABLED:true}

# File Storage Configuration
storage:
  type: ${STORAGE_TYPE:local}
  local:
    upload-dir: ${STORAGE_LOCAL_DIR:./lifelink-uploads}

# Documentation
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
